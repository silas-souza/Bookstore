[tool.poetry]
name = "bookstore"
version = "0.1.0"
description = "Bookstore API"
authors = ["Silas Souza <silas.souzameister1@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12" # Ou "^3.10" para alinhar com o container
django = "^5.0"  # Obs: Django 6.x ainda não foi lançado, use ^5.0 ou a versão desejada
djangorestframework = "^3.15"
psycopg2-binary = "^2.9"
factory-boy = "3.3.0"
django-debug-toolbar = "^7.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-django = "^4.8"
django-debug-toolbar = "^7.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
